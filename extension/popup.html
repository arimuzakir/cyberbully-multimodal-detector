<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberBully Detector — Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <div class="popup-wrap">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-brand">
        <div class="popup-logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div>
          <div class="popup-title">CyberBully Detector</div>
          <div class="popup-version">TRIMODAL V12 SOTA · F1 = 88.42%</div>
        </div>
      </div>
      <div class="api-dot" id="api-dot" title="Memeriksa status API..."></div>
    </div>

    <!-- Platform Badge -->
    <div class="platform-row">
      <div class="platform-detected" id="platform-badge">🔍 Mendeteksi platform...</div>
      <div class="platform-url" id="platform-url">—</div>
    </div>

    <!-- Toggle -->
    <div class="toggle-row">
      <span class="toggle-label">Auto-Scan Komentar & Feed</span>
      <label class="toggle-switch">
        <input type="checkbox" id="auto-toggle"/>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-num text-primary" id="stat-scanned">0</div>
        <div class="stat-lbl">Dipindai</div>
      </div>
      <div class="stat-box danger">
        <div class="stat-num text-danger" id="stat-bully">0</div>
        <div class="stat-lbl">Bullying</div>
      </div>
      <div class="stat-box safe">
        <div class="stat-num text-success" id="stat-safe">0</div>
        <div class="stat-lbl">Aman</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions-wrap">
      <button class="btn btn-primary" id="btn-scan-all" style="font-size:13px;padding:11px 14px;background:#059669;font-weight:700;" title="1-Klik: Buka seluruh komentar sampai ke akar-akarnya, scan teks, dan analisis video/audio Trimodal">
        <span class="btn-icon">⚡</span>
        <span class="btn-text" id="btn-scan-all-text">Scan & Buka Semua Komentar Lengkap</span>
      </button>

      <button class="btn btn-primary-dark" id="btn-send-dashboard" title="Kirim seluruh komentar halaman ke Dashboard Web untuk analisis tabel lengkap">
        <span class="btn-icon">🚀</span>
        <span class="btn-text" id="btn-dash-text">Buka & Analisis di Dashboard</span>
      </button>

      <button class="btn btn-secondary" id="btn-expand">
        <span class="btn-icon">📖</span>
        <span class="btn-text" id="btn-expand-text">Buka Semua Komentar & Balasan</span>
      </button>

      <div class="action-btn-row">
        <button class="btn btn-tertiary" id="btn-copy-clean" title="Salin seluruh teks komentar bersih (1 baris/komentar) ke clipboard">
          <span class="btn-icon">📋</span>
          <span class="btn-text" id="btn-copy-clean-text">Salin Teks</span>
        </button>
        <button class="btn btn-tertiary" id="btn-view-source" title="Buka live DOM rendered HTML di tab baru">
          <span class="btn-icon">📄</span>
          <span class="btn-text" id="btn-source-text">View Source</span>
        </button>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-row" id="progress-row" style="display:none">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text">Memproses...</span>
    </div>

    <!-- Recent -->
    <div class="recent-section">
      <div class="recent-header">
        <span>📋 Terdeteksi Terakhir</span>
        <button class="btn-clear-sm" id="btn-clear">Hapus</button>
      </div>
      <div class="recent-list" id="recent-list">
        <div class="recent-empty">Belum ada deteksi.</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <a href="http://localhost:5500/index.html" target="_blank" class="footer-link" id="link-dashboard">
        🌐 Dashboard Web
      </a>
      <span class="footer-sep">·</span>
      <span class="footer-mode" id="footer-mode">—</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
